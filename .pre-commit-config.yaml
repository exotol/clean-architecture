repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.9
    hooks:
      - id: ruff-format
      - id: ruff
        args: ["--exit-non-zero-on-fix"]

  - repo: local
    hooks:
      - id: check-basemodel-descriptions
        name: check BaseModel field descriptions
        entry: uv run python -m scripts.check_basemodel_descriptions
        language: system
        pass_filenames: true
        files: ^src/
        types: [python]

      - id: check-dataclass-descriptions
        name: check dataclass field descriptions
        entry: uv run python -m scripts.check_dataclass_descriptions
        language: system
        pass_filenames: true
        files: ^src/
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.9
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: validate-commit-msg-ru
        name: validate commit message language (RU)
        entry: python3 scripts/validate_commit_message_ru.py
        language: system
        stages: [commit-msg]
        pass_filenames: false
