[project]
name = "eva"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asgi-correlation-id>=4.3.4",
    "dependency-injector>=4.48.3",
    "dynaconf>=3.2.12",
    "fastapi>=0.124.4",
    "granian[reload]>=2.6.0",
    "loguru>=0.7.3",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45.0",
    "opentelemetry-exporter-prometheus",
    "opentelemetry-exporter-otlp>=1.24.0",
    "orjson>=3.11.5",
    "snakeviz>=2.2.2",
    "speedscope>=1.0",
]

[dependency-groups]
dev = [
    "darglint>=1.8.1",
    "flake8-pyproject>=1.2.4",
    "httpx>=0.28.1",
    "isort>=7.0.0",
    "mypy>=1.19.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "locust>=2.32.0",
    "ruff>=0.14.9",
    "types-colorama>=0.4.15.20250801",
    "wemake-python-styleguide>=1.4.0",
    "pytest-cov>=7.0.0",
]



# ==============================================================================
#                                    RUFF
# ==============================================================================
# Ruff — сверхбыстрый линтер и форматтер для Python (замена flake8, isort, etc.)
# Docs: https://docs.astral.sh/ruff/
# ==============================================================================

[tool.ruff]
# -----------------------------------------------------------------------------
# Глобальные настройки
# -----------------------------------------------------------------------------
target-version = "py312"          # Целевая версия Python для проверок синтаксиса
line-length = 79                  # PEP 8 рекомендует 79, Google допускает 80
indent-width = 4                  # Стандартный отступ Python
preview = true                    # Включить экспериментальные правила (более строгие)
src = ["src", "tests"]            # Директории с исходным кодом (для first-party imports)


# -----------------------------------------------------------------------------
# Форматирование кода (ruff format)
# -----------------------------------------------------------------------------
[tool.ruff.format]
quote-style = "double"            # Google Style: двойные кавычки
indent-style = "space"            # Пробелы вместо табов
skip-magic-trailing-comma = false # Сохранять trailing comma для multiline
line-ending = "auto"              # Определять автоматически (LF/CRLF)


# -----------------------------------------------------------------------------
# Правила линтера (ruff check)
# -----------------------------------------------------------------------------
[tool.ruff.lint]
select = [
    # =========================================================================
    # БАЗОВЫЕ ПРАВИЛА (ОБЯЗАТЕЛЬНЫЕ)
    # =========================================================================
    "F",      # Pyflakes: ошибки логики (undefined names, unused imports)
    "E",      # pycodestyle errors: синтаксические ошибки PEP 8
    "W",      # pycodestyle warnings: предупреждения PEP 8

    # =========================================================================
    # ИМПОРТЫ И МОДУЛИ
    # =========================================================================
    "I",      # isort: автосортировка импортов (Google style)
    "ICN",    # flake8-import-conventions: стандартные алиасы (pd, np, plt)
    "TID",    # flake8-tidy-imports: запрет относительных импортов
    "TCH",    # flake8-type-checking: TYPE_CHECKING блоки для type-only imports

    # =========================================================================
    # ИМЕНОВАНИЕ И СТИЛЬ
    # =========================================================================
    "N",      # pep8-naming: правильные имена (snake_case, PascalCase)
    "D",      # pydocstyle: Google Docstrings обязательны
    "Q",      # flake8-quotes: консистентные кавычки (double)
    "COM",    # flake8-commas: trailing commas в multiline

    # =========================================================================
    # ТИПИЗАЦИЯ И АННОТАЦИИ
    # =========================================================================
    "ANN",    # flake8-annotations: ТРЕБУЕТ типы везде
    "FA",     # flake8-future-annotations: from __future__ import annotations
    "UP",     # pyupgrade: модернизация синтаксиса под новые версии Python

    # =========================================================================
    # БЕЗОПАСНОСТЬ
    # =========================================================================
    "S",      # Bandit: проверки безопасности (SQL injection, hardcoded passwords)
    "BLE",    # flake8-blind-except: ЗАПРЕЩАЕТ `except Exception:`

    # =========================================================================
    # СЛОЖНОСТЬ И СТРУКТУРА
    # =========================================================================
    "C90",    # McCabe: цикломатическая сложность (max-complexity)
    "PL",     # Pylint: мощный статический анализ (args, branches, locals)

    # =========================================================================
    # АНТИПАТТЕРНЫ И БАГИ
    # =========================================================================
    "B",      # Bugbear: поиск неочевидных багов (mutable defaults, etc.)
    "A",      # flake8-builtins: ЗАПРЕТ перекрытия id, list, dict, type
    "PIE",    # flake8-pie: мелкие улучшения логики
    "SIM",    # flake8-simplify: предложения упростить if/else
    "RET",    # flake8-return: проверка логики return
    "RSE",    # flake8-raise: упрощение raise statements
    "FBT",    # flake8-boolean-trap: ЗАПРЕТ функций типа foo(True, False)
    "ARG",    # flake8-unused-arguments: неиспользуемые аргументы функций
    "SLF",    # flake8-self: ЗАПРЕТ доступа к _private полям извне класса
    "ERA",    # Eradicate: ЗАПРЕТ закомментированного кода

    # =========================================================================
    # ПРОИЗВОДИТЕЛЬНОСТЬ
    # =========================================================================
    "PERF",   # Perflint: антипаттерны производительности
    "C4",     # flake8-comprehensions: оптимизация list/dict comprehensions
    "FURB",   # Refurb: модернизация и оптимизация кода
    "FLY",    # Flynt: конвертация в f-strings

    # =========================================================================
    # ДАТЫ, ВРЕМЯ, ДЕБАГ
    # =========================================================================
    "DTZ",    # flake8-datetimez: ЗАПРЕТ datetime.now() без timezone
    "T10",    # flake8-debugger: ЗАПРЕТ breakpoint() и pdb в коде
    "T20",    # flake8-print: ЗАПРЕТ print() — используй logger

    # =========================================================================
    # ЛОГИРОВАНИЕ
    # =========================================================================
    "G",      # flake8-logging-format: правильное форматирование логов
    "LOG",    # flake8-logging: современные практики логирования

    # =========================================================================
    # ИСКЛЮЧЕНИЯ (TRY/EXCEPT)
    # =========================================================================
    "TRY",    # Tryceratops: плохие практики в try/except блоках
    "EM",     # flake8-errmsg: строки ошибок в переменных (не inline)

    # =========================================================================
    # ТЕСТЫ (PYTEST)
    # =========================================================================
    "PT",     # flake8-pytest-style: правильный стиль pytest фикстур/тестов

    # =========================================================================
    # ФАЙЛЫ И ПУТИ
    # =========================================================================
    "PTH",    # flake8-use-pathlib: ЗАПРЕТ os.path — используй pathlib
    "EXE",    # flake8-executable: проверка прав доступа файлов

    # =========================================================================
    # СОВМЕСТИМОСТЬ И ИНТЕРНАЦИОНАЛИЗАЦИЯ
    # =========================================================================
    "YTT",    # flake8-2020: ошибки совместимости версий Python
    "INT",    # flake8-gettext: интернационализация (i18n)

    # =========================================================================
    # ASYNC
    # =========================================================================
    "ASYNC",  # flake8-async: антипаттерны в async коде

    # =========================================================================
    # ДОПОЛНИТЕЛЬНЫЕ СТРОГИЕ ПРАВИЛА
    # =========================================================================
    "PGH",    # pygrep-hooks: общие антипаттерны (blanket-noqa, etc.)
    "SLOT",   # flake8-slots: __slots__ для dataclasses (memory optimization)
    "ISC",    # flake8-implicit-str-concat: неявная конкатенация строк
    "TD",     # flake8-todos: формат TODO комментариев (TD001, TD002, TD003)
    "FIX",    # flake8-fixme: FIXME/TODO/XXX в коде = предупреждение
    "RUF",    # Ruff-specific: специфичные правила Ruff

    # =========================================================================
    # ФРЕЙМВОРКИ (ОПЦИОНАЛЬНО)
    # =========================================================================
    "DJ",     # flake8-django: правила для Django проектов
    "NPY",    # NumPy-specific: правила для NumPy
]

ignore = [
    # -------------------------------------------------------------------------
    # Docstrings (Google Style допускает пропуск в определённых местах)
    # -------------------------------------------------------------------------
    "D100",   # Missing docstring in public module — модуль часто = один класс
    "D104",   # Missing docstring in public package — __init__.py обычно пуст
    "D106",   # Missing docstring in public nested class — Meta в Pydantic/Django
    "D107",   # Missing docstring in __init__ — Google: docstring класса достаточен
    "TRY003", # Avoid specifying long messages outside the exception class
    "EM102",  # Exception must not use an f-string literal
    "EM101",  # Exception must not use a string literal
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
]

# Разрешаем кириллические буквы в комментариях/docstrings (RUF001, RUF002, RUF003)
allowed-confusables = [
    "В", "А", "Е", "К", "М", "Н", "О",
    "Р", "С", "Т", "У", "Х", "а", "е",
    "о", "р", "с", "у", "х", "г"
]


# -----------------------------------------------------------------------------
# Docstrings (pydocstyle)
# -----------------------------------------------------------------------------
[tool.ruff.lint.pydocstyle]
convention = "google"                  # Google Style Guide для docstrings
# Максимальная длина строки в docstrings (для консистентности)


# -----------------------------------------------------------------------------
# Цикломатическая сложность (McCabe)
# -----------------------------------------------------------------------------
[tool.ruff.lint.mccabe]
max-complexity = 6   # WPS default = 6, Ruff default = 10, NASA = 5


# -----------------------------------------------------------------------------
# Pylint настройки
# -----------------------------------------------------------------------------
[tool.ruff.lint.pylint]
max-args = 5         # Максимум аргументов функции (WPS = 5, Google = 8)
max-branches = 8     # Максимум ветвлений if/else (WPS = 8, Google = 12)
max-locals = 8       # Максимум локальных переменных (WPS = 8)
max-statements = 25  # Максимум statements в функции (WPS = 20, Google = 40)


# -----------------------------------------------------------------------------
# Импорты (isort)
# -----------------------------------------------------------------------------
[tool.ruff.lint.isort]
# PEP 563: отложенные аннотации (экономит память, ускоряет импорт)
required-imports = ["from __future__ import annotations"]

# Сортировка
force-sort-within-sections = true     # Сортировать внутри секций
combine-as-imports = false            # НЕ объединять 'import x as y'

# Форматирование
lines-after-imports = 2               # WPS306: 2 пустые строки после импортов
force-single-line = true              # Каждый импорт на отдельной строке
force-wrap-aliases = true             # Алиасы на новой строке

# First-party модули (определяются как "свои", не third-party)
known-first-party = ["app", "tests"]


# -----------------------------------------------------------------------------
# Кавычки (flake8-quotes)
# -----------------------------------------------------------------------------
[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"              # Google Style: двойные кавычки
multiline-quotes = "double"           # Multiline strings тоже
docstring-quotes = "double"           # Docstrings тоже


# -----------------------------------------------------------------------------
# Относительные импорты (flake8-tidy-imports)
# -----------------------------------------------------------------------------
[tool.ruff.lint.flake8-tidy-imports]
# WPS strict: ЗАПРЕТ всех относительных импортов (from . import X)
ban-relative-imports = "all"


# -----------------------------------------------------------------------------
# Bugbear настройки (B008 workaround для FastAPI)
# -----------------------------------------------------------------------------
[tool.ruff.lint.flake8-bugbear]
# FastAPI Depends() и Orendix DI считать immutable (не нарушает B008)
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "pydantic.Field",
    "orendix.Qualifier",
    "orendix.Autowired",
    "orendix.Value",
    "Qualifier",
    "Autowired",
    "Value",
]


# -----------------------------------------------------------------------------
# Per-file исключения (для тестов, миграций и т.д.)
# -----------------------------------------------------------------------------
[tool.ruff.lint.extend-per-file-ignores]
# ТЕСТЫ: ослабляем некоторые правила
"tests/*" = [
    "S101",      # assert разрешён в тестах (pytest)
    "PLR2004",   # Magic numbers разрешены (assert status == 200)
    "ANN",       # Типы в тестах часто излишни
    "SLF001",    # Доступ к _private для white-box тестирования
    "D",         # Docstrings в тестах не обязательны
    "RUF029",    # Async functions without await allowed
]

# МИГРАЦИИ: Alembic не требует строгой типизации
"alembic/*" = ["ANN"]


# ==============================================================================
#                                    MYPY
# ==============================================================================
# MyPy — статический анализатор типов для Python
# Docs: https://mypy.readthedocs.io/
# ==============================================================================

[tool.mypy]
# -----------------------------------------------------------------------------
# Базовые настройки
# -----------------------------------------------------------------------------
python_version = "3.12"                # Целевая версия Python
files = ["src"]                        # Директории для проверки
mypy_path = "src"                      # PYTHONPATH для резолва модулей

# -----------------------------------------------------------------------------
# Строгость (МАКСИМАЛЬНАЯ)
# -----------------------------------------------------------------------------
strict = true                          # Включает большинство строгих проверок
show_error_codes = true                # Показывать [error-code] для удобства
warn_unused_configs = true             # Предупреждать о неиспользуемых настройках

# -----------------------------------------------------------------------------
# Декораторы
# -----------------------------------------------------------------------------
disallow_untyped_decorators = true     # ЗАПРЕТ декораторов без типов

# -----------------------------------------------------------------------------
# Аннотации функций
# -----------------------------------------------------------------------------
disallow_untyped_defs = true           # ЗАПРЕТ функций без аннотаций
disallow_incomplete_defs = true        # ЗАПРЕТ частичных аннотаций (def foo(x: int, y):)
check_untyped_defs = true              # Проверять тело даже нетипизированных функций

# -----------------------------------------------------------------------------
# Any и Generics
# -----------------------------------------------------------------------------
disallow_any_unimported = false        # Разрешить Any из библиотек без типов
ignore_missing_imports = false         # ОШИБКА если не найдены стабы типов
disallow_any_generics = true           # ЗАПРЕТ List вместо List[int]

# -----------------------------------------------------------------------------
# Предупреждения
# -----------------------------------------------------------------------------
warn_return_any = true                 # ЗАПРЕТ возвращать Any из typed функций
warn_unused_ignores = true             # Предупреждать о ненужных # type: ignore
warn_redundant_casts = true            # Предупреждать о лишних cast()

# -----------------------------------------------------------------------------
# Дополнительная строгость
# -----------------------------------------------------------------------------
no_implicit_optional = true            # ЗАПРЕТ x: int = None (нужен Optional[int])
strict_equality = true                 # ЗАПРЕТ сравнения несовместимых типов

# -----------------------------------------------------------------------------
# Плагины
# -----------------------------------------------------------------------------
plugins = ["pydantic.mypy"]            # Pydantic интеграция для FastAPI


# -----------------------------------------------------------------------------
# Pydantic плагин (максимальная строгость)
# -----------------------------------------------------------------------------
[tool.pydantic-mypy]
init_forbid_extra = true               # ЗАПРЕТ лишних аргументов в конструкторе
init_typed = true                      # Строгая проверка типов в __init__
warn_required_dynamic_aliases = true   # Предупреждать о динамических алиасах


# -----------------------------------------------------------------------------
# Overrides: библиотеки без типов
# -----------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = [
    "dynaconf.*",                      # Нет стабов типов
    "dependency_injector.*",           # Сложная магия с Any
    "structlog.*",                     # Опционально типизирован
    "orendix.*",                       # DI framework с runtime магией
    "app.core.containers"              # DI контейнер наследует от Any
]
disallow_subclassing_any = false       # Разрешить наследование от Any
ignore_missing_imports = true          # Игнорировать отсутствие стабов
disallow_any_unimported = false        # Разрешить Any из этих библиотек


# -----------------------------------------------------------------------------
# Overrides: модули с Orendix DI аннотациями (Qualifier/Autowired)
# -----------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = []
# DI-декораторы Orendix возвращают прокси объекты, а не реальные типы
disable_error_code = []


# -----------------------------------------------------------------------------
# Overrides: сложные декораторы
# -----------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = []
disallow_untyped_decorators = true    # Сложные декораторы с DI магией


# ==============================================================================
#                                  COVERAGE
# ==============================================================================
# Coverage.py — измерение покрытия кода тестами
# Docs: https://coverage.readthedocs.io/
# ==============================================================================

[tool.coverage.report]
fail_under = 95                        # Минимальный порог покрытия (%)

# Строки, исключаемые из подсчёта покрытия
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",      # Точка входа скрипта
    "def __repr__",                    # Debug представление
    "raise NotImplementedError",       # Абстрактные методы
    "@(abc\\.)?abstractmethod",
]
